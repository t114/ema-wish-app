<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絵馬に願いを</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&family=Noto+Serif+JP&family=Zen+Maru+Gothic&family=Yuji+Syuku&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-wrapper">
        <div class="ema-container" id="ema-area">
            <img src="ema_hinagata.png" alt="絵馬" class="ema-image">
            <textarea class="wish-input" placeholder="ここに願い事を書いてください" spellcheck="false"></textarea>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>文字の向き</label>
                <div class="radio-group">
                    <label><input type="radio" name="direction" value="vertical-rl" checked> 縦書き</label>
                    <label><input type="radio" name="direction" value="horizontal-tb"> 横書き</label>
                </div>
            </div>

            <div class="control-group">
                <label>文字サイズ</label>
                <input type="range" id="size-slider" min="16" max="64" value="24">
            </div>

            <div class="control-group">
                <label>文字色</label>
                <input type="color" id="color-picker" value="#333333">
            </div>

            <div class="control-group">
                <label>配置</label>
                <div class="radio-group">
                    <label><input type="radio" name="alignment" value="left"> 左寄せ</label>
                    <label><input type="radio" name="alignment" value="center" checked> 中央</label>
                    <label><input type="radio" name="alignment" value="right"> 右寄せ</label>
                </div>
            </div>

            <div class="control-group">
                <label>フォント</label>
                <select id="font-selector">
                    <option value="Shippori Mincho">しっぽり明朝</option>
                    <option value="Noto Serif JP">Noto Serif</option>
                    <option value="Zen Maru Gothic">まるゴシック</option>
                    <option value="Yuji Syuku">游書体</option>
                </select>
            </div>

            <button id="download-btn">絵馬を保存する</button>
        </div>
    </div>

    <!-- 画像透過チェッカー -->
    <div class="checker-section">
        <h2>画像透過チェッカー</h2>
        <p class="checker-description">画像URLまたはファイルをアップロードして、透過PNG（アルファチャンネル）かどうかを判定します。</p>

        <div class="checker-controls">
            <div class="input-method">
                <label>方法1: 画像URLを入力</label>
                <input type="text" id="image-url-input" placeholder="https://example.com/image.png">
                <button id="check-url-btn">URLから判定</button>
            </div>

            <div class="input-method">
                <label>方法2: ファイルをアップロード</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
        </div>

        <div id="checker-result" class="checker-result" style="display: none;">
            <h3>判定結果</h3>
            <div id="result-content"></div>
            <canvas id="checker-canvas" style="display: none;"></canvas>
        </div>
    </div>

    <script src="html2canvas.min.js"></script>
    <script src="script.js?v=11"></script>
</body>

</html>
